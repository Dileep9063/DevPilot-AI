# DevPilot AI — production-style stack: PostgreSQL + Django (gunicorn) + React (nginx)
#
#   1. cp .env.example .env      (fill in secrets)
#   2. docker compose up -d --build
#   3. open http://localhost:8080
#
# Postgres holds both the Django tables and the LangGraph checkpoints
# (their table names do not collide), so only one database is needed.

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: devpilot
      POSTGRES_USER: devpilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devpilot -d devpilot"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    env_file: .env
    environment:
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY in .env}
      DJANGO_DB_HOST: db
      DJANGO_DB_NAME: devpilot
      DJANGO_DB_USER: devpilot
      DJANGO_DB_PASSWORD: ${POSTGRES_PASSWORD}
      LANGGRAPH_POSTGRES_URI: postgresql://devpilot:${POSTGRES_PASSWORD}@db:5432/devpilot
      DEVPILOT_ASYNC_RUNS: "True"
      DEVPILOT_TEST_SANDBOX: bubblewrap
      DEVPILOT_ALLOW_SHARED_GITHUB_TOKEN: "False"
      DEVPILOT_TEST_TMPFS_BYTES: 536870912
      DEVPILOT_ALLOW_SHARED_GITHUB_TOKEN: "False"
      DEVPILOT_TEST_TMPFS_BYTES: 536870912
      CELERY_BROKER_URL: redis://redis:6379/0
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - workspace:/data/workspace
    ports:
      - "8000:8000"

  worker:
    build: ./backend
    restart: unless-stopped
    mem_limit: 3g
    cpus: 2.0
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    env_file: .env
    environment:
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY in .env}
      DJANGO_DB_HOST: db
      DJANGO_DB_NAME: devpilot
      DJANGO_DB_USER: devpilot
      DJANGO_DB_PASSWORD: ${POSTGRES_PASSWORD}
      LANGGRAPH_POSTGRES_URI: postgresql://devpilot:${POSTGRES_PASSWORD}@db:5432/devpilot
      DEVPILOT_ASYNC_RUNS: "True"
      DEVPILOT_TEST_SANDBOX: bubblewrap
      CELERY_BROKER_URL: redis://redis:6379/0
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
    entrypoint: ["celery"]
    command: ["-A", "config", "worker", "--loglevel=INFO", "--concurrency=1"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - workspace:/data/workspace

  beat:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY in .env}
      DJANGO_DB_HOST: db
      DJANGO_DB_NAME: devpilot
      DJANGO_DB_USER: devpilot
      DJANGO_DB_PASSWORD: ${POSTGRES_PASSWORD}
      LANGGRAPH_POSTGRES_URI: postgresql://devpilot:${POSTGRES_PASSWORD}@db:5432/devpilot
      DEVPILOT_ASYNC_RUNS: "True"
      DEVPILOT_TEST_SANDBOX: bubblewrap
      CELERY_BROKER_URL: redis://redis:6379/0
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
    entrypoint: ["celery"]
    command: ["-A", "config", "beat", "--loglevel=INFO"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
  workspace:
