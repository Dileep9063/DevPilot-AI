name: DevPilot CI

on:
  push:
    branches:
      - main
      - "hardening/**"
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: devpilot
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d devpilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-production-secret
      DJANGO_DEBUG: "False"
      DJANGO_DB_HOST: 127.0.0.1
      DJANGO_DB_NAME: devpilot
      DJANGO_DB_USER: postgres
      DJANGO_DB_PASSWORD: postgres
      LANGGRAPH_POSTGRES_URI: postgresql://postgres:postgres@127.0.0.1:5432/devpilot
      LLM_PROVIDER_ORDER: ""
      GEMINI_API_KEY: ci-dummy-key-not-used
      HF_TOKEN: ci-dummy-token-not-used
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: Install sandbox runtime for integration tests
        run: sudo apt-get update && sudo apt-get install -y bubblewrap util-linux
      - name: Run Django and background-task tests
        run: python manage.py test core
      - name: Run pytest integration suites
        run: pytest core/test_git_delivery.py core/test_llm_fallback.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
